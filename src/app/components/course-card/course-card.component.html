
<article class="course-card">
  <div class="card-header">
    <img [src]="course.imageUrl" [alt]="course.title" class="course-logo" />
    <span class="course-modules">{{ course.modules }}</span>
  </div>
  <div class="card-body">
    <h3>{{ course.title }}</h3>
    <p>{{ course.description }}</p>
  </div>
  <div class="card-footer">
    <a href="" class="btn btn-card">View Course</a>
  </div>
</article>
