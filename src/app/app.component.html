<div class="app-container">
  <!-- Sidebar Navigation -->
  <nav class="sidebar">
    <!-- This section contains the main nav links -->
    <div>
      <!-- Brand/Logo Area -->
      <div class="sidebar-brand">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>DIZI Edutech</span>
      </div>

      <!-- Main Navigation -->
      <ul class="sidebar-nav">
        
        <li>
          <a routerLink="/home" routerLinkActive="active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
          </a>
        </li>
        <li>
          <a routerLink="/courses" routerLinkActive="active">
            <i class="fa-solid fa-book-open"></i>
            <span>Courses</span>
          </a>
        </li>
        <li>
          <a routerLink="/profiles" routerLinkActive="active">
            <i class="fa-solid fa-users"></i>
            <span>Profiles</span>
          </a>
        </li>
      </ul>
      
    </div>

    <!-- This section is for links at the bottom (e.g., settings, logout) -->
    <ul class="sidebar-nav sidebar-footer">
      <li>
        <a href="#"> <!-- This is a placeholder link -->
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Log Out</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main Content Area -->
  <div class="main-content">
    <!-- Top Header -->
    <header class="header">
      <span class="app-title">{{ title }}</span>
      <div class="user-profile">
        <img
          src="https://i.pravatar.cc/40"
          alt="User Avatar"
          class="avatar"
        />
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </header>

    <!-- Page content renders here -->
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
